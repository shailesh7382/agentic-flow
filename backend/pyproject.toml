[project]
name = "local-agentic-flow"
version = "0.1.0"
description = "FastAPI and LangGraph backend for a local LM Studio agent"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "langgraph==1.2.9",
  "openai==2.46.0",
  "pydantic-settings==2.11.0",
  "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
